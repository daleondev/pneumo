name: Build Container Images

on:
  push:
    branches:
      - "main"
    paths:
      - ".containers/**"
      - ".devcontainer/**"
      - "CMakePresets.json"
      - ".github/workflows/build-ci-image.yml"
  pull_request:
    paths:
      - ".containers/**"
      - ".devcontainer/**"
      - "CMakePresets.json"
      - ".github/workflows/build-ci-image.yml"
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/daleondev/pneumo-ci
  DEV_IMAGE: ghcr.io/daleondev/pneumo-devcontainer
  # Non-main dispatches must not replace the images used by normal CI/development.
  IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'clang-p2996-7220baff-gcc16' || format('sha-{0}', github.sha) }}

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the CI image
        if: github.event_name != 'pull_request'
        id: ci
        uses: docker/build-push-action@v7
        with:
          context: .containers
          file: .containers/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build the devcontainer for validation
        uses: docker/build-push-action@v7
        with:
          context: .containers
          file: .containers/Dockerfile
          target: devcontainer
          platforms: linux/amd64
          pull: true
          # PRs use the existing published toolchain. Publishing runs use the
          # exact CI image just built, even if its tag is subsequently moved.
          build-args: ${{ steps.ci.outputs.digest != '' && format('TOOLCHAIN_IMAGE={0}@{1}', env.IMAGE, steps.ci.outputs.digest) || '' }}
          load: true
          tags: pneumo-devcontainer:check
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max

      - name: Check developer tools and build samples as vscode
        run: |
          docker run --rm --user vscode \
            --volume "$GITHUB_WORKSPACE:/workspaces/pneumo:ro" \
            pneumo-devcontainer:check \
            bash /workspaces/pneumo/.containers/smoke-test.sh

      - name: Publish the validated devcontainer
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .containers
          file: .containers/Dockerfile
          target: devcontainer
          platforms: linux/amd64
          build-args: TOOLCHAIN_IMAGE=${{ env.IMAGE }}@${{ steps.ci.outputs.digest }}
          push: true
          tags: |
            ${{ env.DEV_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.DEV_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max
          provenance: mode=max
          sbom: true
