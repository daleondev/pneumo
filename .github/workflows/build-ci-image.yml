name: Build CI Toolchain Image

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/containers/ci/**"
      - ".github/workflows/build-ci-image.yml"
  workflow_dispatch:

concurrency:
  group: ci-toolchain-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/daleondev/pneumo-ci
  IMAGE_TAG: clang-p2996-7220baff-gcc16

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the CI image
        uses: docker/build-push-action@v6
        with:
          context: .github/containers/ci
          file: .github/containers/ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
